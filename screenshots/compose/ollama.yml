# Overlay: hermetic inference. A tiny Ollama model, no external network use after the
# one-time model pull. Shares the stack's network namespace, so the endpoint is
# http://127.0.0.1:11434 (which is also what the `netclaw init` wizard defaults to).
# Relative paths resolve against the directory of docker-compose.screenshots.yml.
services:
  ollama:
    image: ollama/ollama:0.32.0
    network_mode: "service:netns"
    depends_on:
      - netns
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: curlimages/curl:8.13.0
    network_mode: "service:netns"
    entrypoint: ["/bin/sh", "/usr/local/bin/ollama-init.sh"]
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2:0.5b}
    depends_on:
      - ollama
    volumes:
      - ./screenshots/scripts/ollama-init.sh:/usr/local/bin/ollama-init.sh:ro

  netclawd:
    depends_on:
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama-data:
