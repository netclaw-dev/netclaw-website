# Base of the docs capture / verification stack. Do not run this file directly:
# use screenshots/stack.sh or screenshots/capture.sh, which assemble it with the
# overlays under screenshots/compose/ and set the variables below.
#
#   base                          netns + netclawd (no model config: first-run state) + capture
#   screenshots/compose/configured.yml   adds Models.Definitions/Roles, the demo MCP server
#   screenshots/compose/ollama.yml       adds the hermetic Ollama inference backend
#
# Every service shares ONE network namespace (the `netns` container) so the daemon,
# the CLI inside the capture container and any helper all reach each other on
# 127.0.0.1, exactly like a real user's machine. Nothing is published to the host.
# No container_name and no host ports: run as many projects side by side as you like
# (COMPOSE_PROJECT_NAME=dr04 ...).

x-netclaw-image: &netclaw-image ${NETCLAW_IMAGE:-ghcr.io/netclaw-dev/netclaw:${NETCLAW_VERSION:?set by screenshots/stack.sh}}

services:
  netns:
    # Holds the shared network namespace and nothing else.
    image: curlimages/curl:8.13.0
    entrypoint: ["sleep", "infinity"]
    stop_grace_period: 1s

  netclawd:
    image: *netclaw-image
    network_mode: "service:netns"
    environment:
      NETCLAW_Daemon__Port: "5199"
      NETCLAW_Daemon__DisableSelfUpdate: "true"
    volumes:
      # The daemon runs as the non-root `netclaw` user; its home is /home/netclaw/.netclaw.
      - netclaw-home:/home/netclaw/.netclaw
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5199/api/health/ready"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 5s
    stop_grace_period: 10s

  # VHS + the netclaw CLI from the same release image as the daemon. Only started by
  # `docker compose run` (profile `capture`); see screenshots/capture/Dockerfile.
  capture:
    profiles: ["capture"]
    image: netclaw-docs-capture:${NETCLAW_IMAGE_TAG:?set by screenshots/stack.sh}
    build:
      context: ./screenshots/capture
      args:
        NETCLAW_IMAGE: *netclaw-image
    network_mode: "service:netns"
    depends_on:
      netclawd:
        condition: service_healthy
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
      NETCLAW_Daemon__Port: "5199"
      NETCLAW_CONTAINER_SUPERVISOR: entrypoint
    volumes:
      - netclaw-home:/home/netclaw/.netclaw
      - ./screenshots/tapes:/tapes:ro
      - ./screenshots/scripts:/work/screenshots/scripts:ro
      - ${CAPTURE_OUT_DIR:-./screenshots/output}:/out

volumes:
  netclaw-home:
