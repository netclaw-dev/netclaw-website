<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 1200px;
  height: 630px;
  font-family: 'Space Grotesk', sans-serif;
  overflow: hidden;
  background: #0f1117;
}
.container {
  width: 1200px;
  height: 630px;
  background: #0f1117;
  position: relative;
  display: flex;
  flex-direction: column;
  padding: 48px 64px;
}
/* Large purple glow behind logo */
.container::after {
  content: '';
  position: absolute;
  top: -50px;
  right: -50px;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(81, 43, 212, 0.18) 0%, transparent 55%);
  pointer-events: none;
}
/* Teal glow bottom-left */
.container::before {
  content: '';
  position: absolute;
  bottom: -150px;
  left: 200px;
  width: 600px;
  height: 400px;
  background: radial-gradient(circle, rgba(0, 212, 170, 0.08) 0%, transparent 55%);
  pointer-events: none;
}
.accent-top {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #512BD4, #00d4aa, #512BD4);
  z-index: 2;
}
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 1;
  margin-bottom: 20px;
}
.logo-area {
  display: flex;
  align-items: center;
  gap: 14px;
}
.wordmark {
  font-size: 28px;
  font-weight: 700;
  color: #ffffff;
  letter-spacing: -0.5px;
}
.pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  color: #00d4aa;
  border: 1px solid rgba(0, 212, 170, 0.3);
  background: rgba(0, 212, 170, 0.06);
  padding: 5px 14px;
  border-radius: 20px;
  letter-spacing: 0.5px;
}
.main-content {
  flex: 1;
  display: flex;
  align-items: center;
  position: relative;
  z-index: 1;
}
.text-side {
  flex: 1;
  padding-right: 64px;
}
.title {
  font-size: 54px;
  font-weight: 700;
  color: white;
  line-height: 1.1;
  margin-bottom: 18px;
  letter-spacing: -1.5px;
}
.title em {
  font-style: normal;
  color: #00d4aa;
}
.tagline {
  font-size: 20px;
  font-weight: 400;
  color: #9ea3b8;
  line-height: 1.5;
  margin-bottom: 32px;
  max-width: 460px;
}
.features {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.feature {
  display: flex;
  align-items: center;
  gap: 14px;
}
.feature-icon {
  width: 36px;
  height: 36px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.feature-icon-simple { background: rgba(0, 212, 170, 0.12); }
.feature-icon-secure { background: rgba(81, 43, 212, 0.2); }
.feature-icon-reliable { background: rgba(0, 212, 170, 0.12); }
.feature-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 500;
  color: #c2c5cf;
  width: 90px;
  flex-shrink: 0;
}
.feature-desc {
  font-size: 14px;
  color: #6b7084;
}
/* Visual side - large claw with glow */
.visual-side {
  width: 320px;
  height: 320px;
  flex-shrink: 0;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}
.claw-glow {
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(81, 43, 212, 0.2) 0%, rgba(0, 212, 170, 0.05) 50%, transparent 70%);
}
.claw-ring {
  position: absolute;
  width: 240px;
  height: 240px;
  border-radius: 50%;
  border: 1px solid rgba(81, 43, 212, 0.15);
}
.claw-ring-inner {
  position: absolute;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  border: 1px solid rgba(0, 212, 170, 0.1);
}
.footer {
  position: relative;
  z-index: 1;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 0;
}
.footer-left {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  color: #5a5e6e;
}
.footer-right {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: #7c5cf0;
  display: flex;
  align-items: center;
  gap: 10px;
}
</style>
</head>
